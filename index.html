<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Runner</title>
    <style>
        :root {
            --bg-a: #f1f5f9;
            --bg-b: #dbeafe;
            --panel: #ffffff;
            --text: #0f172a;
            --muted: #475569;
            --accent: #0f766e;
            --accent-strong: #115e59;
            --shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "Space Grotesk", "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 10% 15%, rgba(15, 118, 110, 0.22), transparent 35%),
                radial-gradient(circle at 95% 5%, rgba(59, 130, 246, 0.2), transparent 32%),
                linear-gradient(145deg, var(--bg-a), var(--bg-b));
        }

        .app-shell {
            width: min(760px, 100%);
            background: var(--panel);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(148, 163, 184, 0.25);
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(1.55rem, 2.7vw, 2rem);
            letter-spacing: 0.02em;
        }

        .subtitle {
            margin: 0 0 20px;
            color: var(--muted);
            line-height: 1.4;
        }

        .script-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
        }

        .script-card {
            background: #f8fafc;
            border: 1px solid rgba(148, 163, 184, 0.35);
            border-radius: 12px;
            padding: 14px;
        }

        .script-name {
            margin: 0 0 10px;
            font-size: 0.96rem;
            color: #1e293b;
            word-break: break-word;
        }

        .action-row {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 0;
            padding: 10px 12px;
            font: inherit;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 160ms ease, filter 160ms ease;
        }

        .run-script {
            border: 0;
            background: linear-gradient(145deg, var(--accent), var(--accent-strong));
            color: #ffffff;
            box-shadow: 0 8px 18px rgba(15, 118, 110, 0.24);
        }

        .view-code {
            background: #e2e8f0;
            color: #0f172a;
            border: 1px solid rgba(100, 116, 139, 0.3);
        }

        .action-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.03);
        }

        .action-btn:active {
            transform: translateY(0);
        }

        .action-btn:focus-visible {
            outline: 3px solid rgba(20, 184, 166, 0.45);
            outline-offset: 2px;
        }

        .run-script:focus-visible {
            outline-color: rgba(94, 234, 212, 0.55);
        }

        .run-script {
            box-shadow: 0 8px 18px rgba(15, 118, 110, 0.3);
        }

        @media (max-width: 560px) {
            .app-shell {
                padding: 20px;
            }

            .script-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="app-shell">
        <h1>JS Assignment Runner</h1>
        <p class="subtitle">Run scripts directly or open their source files on GitHub.</p>
        <section class="script-grid">
            <article class="script-card">
                <h2 class="script-name">01_digit_gatekeeper.js</h2>
                <div class="action-row">
                    <button class="action-btn run-script" data-script="01_digit_gatekeeper.js">Run</button>
                    <a class="action-btn view-code" href="https://github.com/hexaorzo/JS-Assignment/blob/main/01_digit_gatekeeper.js" target="_blank" rel="noopener noreferrer">View Code</a>
                </div>
            </article>
            <article class="script-card">
                <h2 class="script-name">02_roll-seed_lock.js</h2>
                <div class="action-row">
                    <button class="action-btn run-script" data-script="02_roll-seed_lock.js">Run</button>
                    <a class="action-btn view-code" href="https://github.com/hexaorzo/JS-Assignment/blob/main/02_roll-seed_lock.js" target="_blank" rel="noopener noreferrer">View Code</a>
                </div>
            </article>
            <article class="script-card">
                <h2 class="script-name">03_mirror_corridor.js</h2>
                <div class="action-row">
                    <button class="action-btn run-script" data-script="03_mirror_corridor.js">Run</button>
                    <a class="action-btn view-code" href="https://github.com/hexaorzo/JS-Assignment/blob/main/03_mirror_corridor.js" target="_blank" rel="noopener noreferrer">View Code</a>
                </div>
            </article>
            <article class="script-card">
                <h2 class="script-name">04_fare_calculator.js</h2>
                <div class="action-row">
                    <button class="action-btn run-script" data-script="04_fare_calculator.js">Run</button>
                    <a class="action-btn view-code" href="https://github.com/hexaorzo/JS-Assignment/blob/main/04_fare_calculator.js" target="_blank" rel="noopener noreferrer">View Code</a>
                </div>
            </article>
            <article class="script-card">
                <h2 class="script-name">05_skipping_number.js</h2>
                <div class="action-row">
                    <button class="action-btn run-script" data-script="05_skipping_number.js">Run</button>
                    <a class="action-btn view-code" href="https://github.com/hexaorzo/JS-Assignment/blob/main/05_skipping_number.js" target="_blank" rel="noopener noreferrer">View Code</a>
                </div>
            </article>
            <article class="script-card">
                <h2 class="script-name">06_contest_score_judge.js</h2>
                <div class="action-row">
                    <button class="action-btn run-script" data-script="06_contest_score_judge.js">Run</button>
                    <a class="action-btn view-code" href="https://github.com/hexaorzo/JS-Assignment/blob/main/06_contest_score_judge.js" target="_blank" rel="noopener noreferrer">View Code</a>
                </div>
            </article>
        </section>
    </main>
    <script>
        document.addEventListener('click', function(event) {
            const button = event.target.closest('.run-script');

            if (!button) {
                return;
            }

            const scriptPath = button.dataset.script;

            fetch(scriptPath)
                .then(response => response.text())
                .then(scriptContent => {
                    eval(scriptContent);
                })
                .catch(error => console.error('Error loading script:', error));
        });
    </script>

</body>
</html>
